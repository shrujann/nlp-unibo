[project]
name = "nlp-food-log"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "chainlit>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "arize-phoenix[experiments]>=7.0.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    # experiments only
    "pandas>=2.0.0",
]

[tool.uv.sources]

[project.scripts]
dev = "chainlit:cli"

[tool.uv]
dev-dependencies = []
